name: Desktop app

# Builds the AutoShortsCut desktop app (desktop/, Electron) for Windows,
# Linux and macOS, and puts all three into a DRAFT GitHub release (publish it
# by hand on GitHub). A tag desktop-vX.Y.Z makes the draft for that version;
# any other build makes "vX.Y.Z build N" from desktop/package.json.
#
# The packages carry the backend source and the built dashboard. The first
# launch creates a Python environment from a system Python 3.10-3.12 and
# installs requirements.txt (see desktop/runtime.js), so the target machine
# needs Python and ffmpeg on PATH.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
    branches: [autoshortscut]
    paths:
      - "desktop/**"
      - "dashboard/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: desktop/dist/*.exe
          - os: ubuntu-latest
            target: --linux
            artifact: desktop/dist/*.AppImage
          - os: macos-latest
            target: --mac
            artifact: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Build the desktop app
        working-directory: desktop
        env:
          # No signing certificates: unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: autoshortscut-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # One job for the release: matrix jobs uploading on their own race each
  # other and can leave several drafts for one build.
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the draft
        id: name
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "title=AutoShortsCut ${TAG#desktop-}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-v$VERSION-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "title=AutoShortsCut v$VERSION build $GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Windows installer, Linux AppImage and macOS dmg (unsigned).
            Needs Python 3.10-3.12 and ffmpeg on the machine; the first launch
            installs the processing engine into the app's data folder.
          files: artifacts/*
