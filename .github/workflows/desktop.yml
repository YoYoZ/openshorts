name: Desktop app

# Builds the AutoShortsCut desktop app (desktop/, Electron) for Windows,
# Linux and macOS, and puts all three into a DRAFT GitHub release (publish it
# by hand on GitHub). A tag desktop-vX.Y.Z makes the draft for that version;
# any other build makes "vX.Y.Z build N" from desktop/package.json.
#
# The packages carry the backend source, the built dashboard, a portable
# CPython and static ffmpeg/ffprobe (desktop/fetch-vendor.mjs), so the target
# machine needs nothing preinstalled. The first launch builds a Python
# environment from the bundled interpreter and installs requirements.txt
# (internet needed once, about 3 GB; see desktop/runtime.js).
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
    branches: [autoshortscut]
    paths:
      - "desktop/**"
      - "dashboard/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: desktop/dist/*.exe
          - os: ubuntu-latest
            target: --linux
            artifact: desktop/dist/*.AppImage
          - os: macos-latest
            target: --mac
            artifact: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Bundle Python and ffmpeg
        working-directory: desktop
        run: node fetch-vendor.mjs

      # What a fresh machine does on first launch, with the bundled pieces
      # only: build the environment, install requirements, import the backend.
      - name: Smoke-test the bundled runtime
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=desktop/vendor/python/python.exe; ENVPY=smoke-env/Scripts/python.exe;
          else PY=desktop/vendor/python/bin/python3; ENVPY=smoke-env/bin/python; fi
          export PATH="$PWD/desktop/vendor/ffmpeg:$PATH"
          "$PY" -m venv smoke-env
          "$ENVPY" -m pip install --quiet --upgrade pip
          # CPU PyTorch keeps the test small; the app picks CUDA builds on NVIDIA machines.
          "$ENVPY" -m pip install --quiet torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          "$ENVPY" -m pip install --quiet -r requirements.txt
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q " subtitles " && echo "libass ok"
          PYTHONUTF8=1 "$ENVPY" -c "import app, main, llm_backend, render_gc, shorts_checklist; print('backend imports ok')"
          rm -rf smoke-env

      - name: Build the desktop app
        working-directory: desktop
        env:
          # No signing certificates: unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: autoshortscut-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # One job for the release: matrix jobs uploading on their own race each
  # other and can leave several drafts for one build.
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the draft
        id: name
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "title=AutoShortsCut ${TAG#desktop-}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-v$VERSION-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "title=AutoShortsCut v$VERSION build $GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Windows installer, Linux AppImage and macOS dmg (Apple Silicon), unsigned.
            Self-contained: Python and ffmpeg are bundled. The first launch needs
            internet once to install the processing engine (about 3 GB) into the
            app's data folder.
          files: artifacts/*
